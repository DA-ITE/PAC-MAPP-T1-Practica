<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>El primer paso cambia la historia | SISE</title><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--red:#FF0E49;--dark:#241F21;--gray:#F5F3F4;--line:#E3DFE1;--soft:#FFF1F5}*{box-sizing:border-box}body{margin:0;background:white;color:var(--dark);font:18px/1.35 'Barlow Condensed','Arial Narrow',Arial,sans-serif}main{max-width:1100px;margin:auto;padding:12px}header{background:var(--dark);color:white;border-radius:12px 12px 0 0;border-bottom:4px solid var(--red);padding:17px 22px;display:flex;align-items:center;gap:24px}header img{width:130px;height:auto;object-fit:contain}h1{font-size:32px;line-height:1.05;margin:3px 0}h2{font-size:26px;margin:0 0 8px;line-height:1.1}h3{font-size:21px;margin:0 0 6px}p{margin:0 0 9px}small,.muted{font-size:15px;color:#6A6266}header small{color:white;letter-spacing:1.4px;font-weight:700}button,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--dark);border-radius:8px;padding:10px 15px;font-weight:600}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.4}.primary{background:var(--red);color:white;border-color:var(--red)}.route{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:12px 0}.route button{text-align:left;padding:8px 12px;display:flex;align-items:center;gap:8px}.route b{font-size:23px;color:var(--red)}.route .active{background:var(--dark);color:white;border-color:var(--dark)}.route .done{border-color:var(--red)}.panel{border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:13px 0}.case{padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column;position:relative;min-width:0}.case img{width:100%;height:470px;object-fit:contain;object-position:center top;display:block;background:#F5F3F4;padding:8px}.case .copy{padding:12px;flex:1}.case strong{font-size:25px;display:block}.case .caption{font-size:17px;font-weight:500}.case.selected{border:2px solid var(--red);background:var(--soft)}.case .mark{display:block;color:var(--red);font-size:15px;margin-top:6px}.case.selected .mark{font-weight:800}.caseContext{display:flex;gap:15px;background:var(--gray);border-radius:9px;padding:12px;margin:12px 0}.caseContext img{width:90px;height:120px;object-fit:contain;object-position:center top;border-radius:7px;background:white;padding:4px;border:1px solid var(--line)}.caseContext div{flex:1;min-width:0}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.group{border:1px solid var(--line);border-radius:9px;padding:13px;min-width:0}.choice{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:7px;margin:6px 0;cursor:pointer;background:white}.choice:has(input:checked){background:var(--soft);border-color:var(--red)}input{accent-color:var(--red);width:18px;height:18px;flex:none;margin-top:3px}.feedback{background:var(--gray);border-left:4px solid var(--red);border-radius:6px;padding:11px 14px;margin:10px 0}.guide{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.guide div{background:var(--gray);padding:10px;border-radius:7px}.guide b{display:block;color:var(--red);font-size:20px}textarea{width:100%;resize:vertical;min-height:150px;border:1px solid #CFC9CC;border-radius:8px;padding:12px;line-height:1.5;color:var(--dark)}.actions{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:14px}.actions .right{display:flex;gap:8px;flex-wrap:wrap}.progress{height:6px;border-radius:8px;background:var(--line);overflow:hidden;margin:0 0 12px}.progress span{height:100%;display:block;background:var(--red);transition:width .2s}.hidden,[hidden]{display:none!important}.reference{margin-top:10px}.reference summary{cursor:pointer;color:var(--red);font-weight:700}.reference p{margin-top:8px}.finish{background:var(--dark);color:white;border-radius:9px;padding:17px;margin-top:14px}.finish h2{color:white}footer{text-align:right;font-size:13px;color:#6A6266;padding:9px 2px}.error{color:var(--dark);font-weight:600;border-left:4px solid var(--red);padding:8px 12px;background:var(--soft);margin-top:10px}.brief{font-size:16px}.wordcount{text-align:right;font-size:15px;color:#6A6266}button:hover:not(:disabled){border-color:var(--red)}@media(max-width:650px){main{padding:7px}header{padding:14px;gap:12px}header img{width:90px}h1{font-size:25px}.route{gap:4px}.route button{padding:6px;display:block;text-align:center;font-size:15px}.route b{display:block;font-size:19px}.cards{grid-template-columns:1fr}.case{display:grid;grid-template-columns:110px 1fr}.case img{height:100%;min-height:180px;aspect-ratio:auto;object-fit:contain;object-position:center top;background:#F5F3F4;padding:6px}.cols{grid-template-columns:1fr}.guide{grid-template-columns:1fr 1fr}.panel{padding:12px}}
.case{border:2px solid var(--line)}.case img{width:100%;height:auto;min-height:0;aspect-ratio:auto;object-fit:contain;padding:0;margin:0;background:white}.caseContext{border-left:4px solid var(--red)}@media(max-width:650px){.case{display:flex;flex-direction:column}.case img{width:100%;height:auto;min-height:0;padding:0}.route button{padding:4px;font-size:14px}}
</style></head><body><main><header><img src="assets/logo-sise.png" alt="Instituto SISE"><div><small>APLICA · MÓDULO 1 · TEMA 1</small><h1>El primer paso cambia la historia</h1><p style="margin:0">Laboratorio de comunicación empática</p></div></header><nav class="route" aria-label="Pasos de la práctica" id="route"></nav><div class="progress" role="progressbar" aria-label="Avance" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0"><span></span></div><section class="panel" id="panel"></section><div class="actions"><button id="back" type="button">‹ Anterior</button><span id="stepLabel" class="muted"></span><div class="right"><button id="next" type="button" class="primary">Continuar ›</button></div></div><footer>Instituto SISE · Grupo EducaD</footer></main><script>
const DATA=[{name:'Valeria',title:'Entre el trabajo y los estudios',img:'assets/valeria.webp',alt:'Valeria estudia en el autobús mientras revisa la hora.',case:'Valeria participaba regularmente en clase. Durante las últimas dos semanas ha ingresado tarde a las sesiones, tiene dos actividades pendientes y ha dejado de responder las preguntas del docente.',signals:['Ingresos tardíos a clase','Dos actividades pendientes','Menor participación','Falta de compromiso'],decisions:['Enviar un recordatorio individual sobre las actividades pendientes y sus fechas de entrega.','Contactarla para conocer qué está dificultando su participación y ofrecer orientación.','Conversar con ella al finalizar la próxima clase para revisar sus pendientes.','Compartirle nuevamente los recursos y recomendaciones de organización del curso.'],feedback:['Es útil para recordar responsabilidades, pero aún necesitas comprender sus dificultades.','Esta intervención permite conocer sus necesidades y ofrecer acompañamiento oportuno.','La conversación puede ser pertinente. Considera si esperar hasta la próxima sesión podría retrasar el apoyo.','Los recursos pueden ayudar, pero conviene conocer primero qué está dificultando su avance.'],model:'Hola, Valeria. He observado que has ingresado tarde a las últimas sesiones y tienes dos actividades pendientes. ¿Qué dificultades estás encontrando para avanzar? Podemos revisar las orientaciones y las alternativas permitidas para organizar tus pendientes. Cuéntame qué actividad necesitas priorizar y coordinemos un momento para conversar.'},{name:'Andrés',title:'Cuando aprender se vuelve difícil',img:'assets/andres.webp',alt:'Andrés intenta resolver ejercicios y observa sus apuntes con dudas.',case:'Andrés asiste regularmente y entrega sus actividades, pero sus últimos resultados son bajos. Durante las prácticas solicita constantemente ayuda y ha expresado que no se siente capaz de completar los ejercicios por sí mismo.',signals:['Resultados académicos bajos','Solicitudes frecuentes de ayuda','Expresa inseguridad','Falta de capacidad para aprender'],decisions:['Compartir ejercicios adicionales para que practique de manera independiente.','Conversar con él para identificar qué procedimientos le generan dificultad y orientar su práctica.','Recomendarle revisar nuevamente los materiales antes de solicitar ayuda.','Resolver con él un ejercicio completo para demostrarle cómo hacerlo.'],feedback:['La práctica adicional puede ayudar, aunque primero conviene identificar qué necesita reforzar.','Esta intervención permite orientar el aprendizaje y fortalecer progresivamente su autonomía.','Revisar materiales puede ser útil, pero Andrés necesita una orientación más específica.','Una demostración puede ayudar si después permites que Andrés practique por sí mismo.'],model:'Hola, Andrés. He observado que tus últimos resultados han disminuido y que durante las prácticas necesitas apoyo frecuente. ¿Qué parte de los procedimientos te resulta más difícil? Podemos revisar un ejemplo y luego practicarás un ejercicio similar de manera autónoma. Cuéntame qué tema te gustaría reforzar primero.'},{name:'Camila',title:'Cada vez más distante',img:'assets/camila.webp',alt:'Camila revisa una consulta sin respuesta mientras sus compañeros conversan.',case:'Camila comenzó el curso con buenos resultados. En las últimas sesiones ha reducido su participación, no ha presentado una actividad y ha enviado una consulta al docente que todavía no recibe respuesta.',signals:['Menor participación','Actividad pendiente','Consulta sin respuesta','Desinterés por el curso'],decisions:['Responder su consulta y recordarle las actividades pendientes.','Contactarla, reconocer la demora en la respuesta y explorar cómo está avanzando.','Esperar la próxima clase para conversar presencialmente.','Reenviarle las instrucciones de la actividad que tiene pendiente.'],feedback:['Responder la consulta es necesario, pero también resulta pertinente explorar los cambios en su participación.','Esta intervención reconoce la falta de respuesta y abre una oportunidad para reconstruir el vínculo.','Conversar presencialmente puede ser útil, pero considera atender oportunamente la consulta pendiente.','Las instrucciones pueden ayudar, aunque no necesariamente atienden la necesidad de comunicación.'],model:'Hola, Camila. Lamento la demora en responder tu consulta. He observado que tu participación ha disminuido y tienes una actividad pendiente. ¿Cómo te está yendo con el curso? Podemos revisar tu consulta y las orientaciones de la actividad. Cuéntame qué necesitas aclarar primero para que podamos definir cómo avanzar.'}];
const BARRIERS=['Académicas','Laborales','Tecnológicas','Personales','Motivacionales'];const CRITERIA=['Personalicé el mensaje.','Describí hechos sin emitir juicios.','Utilicé un lenguaje empático y respetuoso.','Formulé una pregunta abierta.','Ofrecí orientación dentro de mi rol docente.','Propuse un siguiente paso que favorece la autonomía y respeta la privacidad.'];const STEPS=['Elige','Analiza','Decide','Construye','Mejora'];const states=DATA.map(()=>({signals:[],barriers:[],checked:false,decision:null,message:'',criteria:[],finished:false}));let selected=-1,step=0;const $=id=>document.getElementById(id);const panel=$('panel');const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));function state(){return states[selected]}function unlocked(){if(selected<0)return 0;let s=state();return !s.checked?1:s.decision===null?2:!s.message.trim()?3:4}function context(){let c=DATA[selected];return `<div class="caseContext"><div><h3>${c.name} · ${c.title}</h3><p style="margin:0">${c.case}</p></div></div>`}function choices(items,key){return items.map((v,i)=>`<label class="choice"><input type="checkbox" data-key="${key}" value="${i}" ${state()[key].includes(i)?'checked':''}><span>${v}</span></label>`).join('')}function signalFeedback(){let s=state();let missing=[0,1,2].filter(i=>!s.signals.includes(i));return (s.signals.includes(3)?'La última afirmación es una interpretación, no un hecho comprobable. ': '')+(missing.length?'Revisa también estas señales: '+missing.map(i=>DATA[selected].signals[i]).join('; ')+'. ':'Has identificado las tres señales observables. ')+'Las barreras seleccionadas son hipótesis para explorar, no diagnósticos.'}function render(){let max=unlocked();$('route').innerHTML=STEPS.map((v,i)=>`<button type="button" data-step="${i}" class="${i===step?'active':i<step?'done':''}" ${i>max?'disabled':''} ${i===step?'aria-current="step"':''}><b>0${i+1}</b>${v}</button>`).join('');document.querySelector('.progress span').style.width=(selected>=0&&state().finished?100:step*20)+'%';document.querySelector('.progress').setAttribute('aria-valuenow',selected>=0&&state().finished?5:step);$('stepLabel').textContent=`Paso ${step+1} de 5`; $('back').disabled=step===0;$('next').textContent=step===4?'Finalizar práctica':'Continuar ›';$('next').disabled=false;let c=DATA[selected],s=state();if(step===0){panel.innerHTML=`<h2>Elige una historia</h2><p>Selecciona un caso y acompaña al estudiante a lo largo de la práctica.</p><div class="cards">${DATA.map((d,i)=>`<button type="button" class="case ${selected===i?'selected':''}" data-case="${i}" aria-pressed="${selected===i}"><img src="${d.img}" alt="${d.alt}"><div class="copy"><strong>${d.name}</strong><span class="caption">${d.title}</span><span class="mark">${selected===i?'✓ Caso seleccionado':'Elegir caso ›'}</span></div></button>`).join('')}</div>`; }else if(step===1){panel.innerHTML=`<h2>Analiza la situación</h2><p>Lee el caso e identifica las señales observables y las posibles barreras.</p>${context()}<div class="cols"><div class="group"><h3>¿Qué señales puedes comprobar?</h3><p class="brief">Selecciona únicamente los hechos observables.</p>${choices(c.signals,'signals')}</div><div class="group"><h3>¿Qué barreras explorarías?</h3><p class="brief">Selecciona una o más posibilidades.</p>${choices(BARRIERS,'barriers')}</div></div><div class="actions"><button type="button" id="verify">Revisar mi análisis</button></div>${s.checked?`<div class="feedback" role="status">${signalFeedback()}</div>`:''}`;}else if(step===2){panel.innerHTML=`<h2>Decide cómo intervenir</h2>${context()}<p><b>¿Cómo iniciarías el acompañamiento?</b></p>${c.decisions.map((d,i)=>`<label class="choice"><input type="radio" name="decision" value="${i}" ${s.decision===i?'checked':''}><span>${d}</span></label>`).join('')}${s.decision!==null?`<div class="feedback" role="status"><b>Retroalimentación</b><br>${c.feedback[s.decision]}</div>`:''}`;}else if(step===3){panel.innerHTML=`<h2>Construye tu mensaje</h2>${context()}<p>Imagina que escribirás a ${c.name} por Canvas. Abre un diálogo cercano y orientado al acompañamiento.</p><div class="guide">${[['Reconoce','Describe la situación.'],['Pregunta','Explora la necesidad.'],['Orienta','Ofrece apoyo.'],['Acuerda','Propón un siguiente paso.']].map((v,i)=>`<div><b>0${i+1} ${v[0]}</b>${v[1]}</div>`).join('')}</div><label for="message"><b>Para: ${c.name}</b></label><textarea id="message" placeholder="Hola, ${c.name}...">${esc(s.message)}</textarea><div class="wordcount" id="words"></div><p class="muted">Procura redactar un mensaje natural y breve (50 a 100 palabras sugeridas).</p>`;}else{panel.innerHTML=`<h2>Revisa y mejora</h2><p>Contrasta tu mensaje con estos criterios y ajústalo si es necesario.</p><div class="cols"><div class="group"><h3>Lista de cotejo</h3>${choices(CRITERIA,'criteria')}<p id="checkCount" class="muted">${s.criteria.length} de 6 criterios revisados.</p></div><div class="group"><h3>Tu mensaje para ${c.name}</h3><textarea id="message">${esc(s.message)}</textarea><div class="wordcount" id="words"></div><details class="reference"><summary>Consultar mensaje de referencia</summary><p>${c.model}</p></details></div></div><div class="actions"><button type="button" id="copy">Copiar mi mensaje</button><button type="button" id="download">Descargar ficha</button></div><div id="result" aria-live="polite"></div>${s.finished?'<div class="finish"><h2>Acompañar empieza con una conversación.</h2>Has completado la práctica. Conserva tu ficha y adapta estos criterios a tu labor docente. Regresa a Canvas para continuar.</div>':''}`;}wire();}
function words(){if($('words'))$('words').textContent=(state().message.trim()?state().message.trim().split(/\s+/).length:0)+' palabras'}function error(t){let e=$('error');if(!e){e=document.createElement('div');e.id='error';e.className='error';e.setAttribute('role','alert');panel.appendChild(e)}e.textContent=t}function refreshRoute(){document.querySelectorAll('[data-step]').forEach(b=>b.disabled=Number(b.dataset.step)>unlocked())}function wire(){document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{step=Number(b.dataset.step);render()});panel.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.case);render();panel.querySelector('[data-case="'+selected+'"]').focus()});panel.querySelectorAll('[data-key]').forEach(b=>b.onchange=()=>{let s=state(),key=b.dataset.key,i=Number(b.value);s[key]=b.checked?[...s[key],i]:s[key].filter(x=>x!==i);s.finished=false;if(key!=='criteria'){s.checked=false;refreshRoute();let old=panel.querySelector('[role="status"]');if(old)old.remove()}else $('checkCount').textContent=s.criteria.length+' de 6 criterios revisados.'});if($('verify'))$('verify').onclick=()=>{if(!state().signals.length||!state().barriers.length){error('Selecciona al menos una señal y una posible barrera.');return}state().checked=true;render();$('verify').focus()};panel.querySelectorAll('[name="decision"]').forEach(b=>b.onchange=()=>{state().decision=Number(b.value);state().finished=false;render();panel.querySelector('[name="decision"]:checked').focus()});if($('message')){$('message').oninput=()=>{let s=state();s.message=$('message').value;s.criteria=[];s.finished=false;words();refreshRoute();if(step===4){panel.querySelectorAll('[data-key="criteria"]').forEach(b=>b.checked=false);$('checkCount').textContent='0 de 6 criterios revisados.';panel.querySelector('.finish')?.remove()}};words()}if($('copy'))$('copy').onclick=async()=>{if(!state().message.trim()){error('Redacta tu mensaje antes de copiarlo.');return}try{await navigator.clipboard.writeText(state().message);$('result').textContent='Mensaje copiado.'}catch(e){$('message').select();$('result').textContent='Selecciona y copia el mensaje con Ctrl+C o Cmd+C.'}};if($('download'))$('download').onclick=download;}
function download(){let s=state(),c=DATA[selected];if(!s.message.trim()){error('Redacta tu mensaje antes de descargar la ficha.');return}const text=`INSTITUTO SISE - GRUPO EDUCAD\nEL PRIMER PASO CAMBIA LA HISTORIA\nFicha de diagnóstico y primer contacto personalizado\n\nCaso: ${c.name} - ${c.title}\n${c.case}\n\nSeñales seleccionadas:\n${s.signals.map(i=>'- '+c.signals[i]).join('\n')}\n\nPosibles barreras (hipótesis):\n${s.barriers.map(i=>'- '+BARRIERS[i]).join('\n')}\n\nNecesidad de acompañamiento a explorar: comprender las dificultades que afectan el avance del estudiante.\n\nDecisión:\n${c.decisions[s.decision]||''}\n\nMensaje personalizado:\n${s.message}\n\nLista de cotejo (autorrevisión):\n${CRITERIA.map((v,i)=>(s.criteria.includes(i)?'[X] ':'[ ] ')+v).join('\n')}\n`;let blob=new Blob(['\uFEFF'+text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Ficha_primer_contacto_'+c.name+'.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$('result').textContent='Se solicitó la descarga de tu ficha.'} $('back').onclick=()=>{if(step>0){step--;render()}};$('next').onclick=()=>{if(selected<0){error('Elige un caso para empezar.');return}let s=state();if(step===1&&!s.checked){error('Completa y revisa tu análisis antes de continuar.');return}if(step===2&&s.decision===null){error('Selecciona una intervención.');return}if(step>=3&&!s.message.trim()){error('Redacta tu mensaje antes de continuar.');return}if(step===4){if(s.criteria.length!==6){error('Revisa los seis criterios y marca los que cumple tu mensaje. Ajusta el texto si es necesario.');return}s.finished=true;render();return}step++;render();requestAnimationFrame(()=>{$('route').scrollIntoView({behavior:'smooth',block:'start'});})};render();
</script></body></html>
